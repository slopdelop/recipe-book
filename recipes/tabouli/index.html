<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfaf6">
  <meta name="description" content="A personal collection of recipes. Just the ingredients and steps.">
  <meta name="apple-mobile-web-app-title" content="Recipe Book">
  <title>Tabouli · Recipe Book</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css?v=9">
  <script src="recipes.js?v=9" defer></script>
  <script src="ingredient-colors.js?v=9" defer></script>
  <script src="journal.js?v=1" defer></script>
  <script src="app.js?v=9" defer></script>
</head>
<body data-recipe="tabouli">
  <main>
    <section id="collection" hidden>
      <header class="collection-masthead"><a class="brand" href="./"><img src="icon.svg" width="40" height="40" alt="">Recipe Book</a><span>THE PERSONAL COLLECTION</span></header>
      <div class="collection-heading"><div><div class="eyebrow">MY KITCHEN</div><h1>Your recipes</h1></div><span id="count" aria-live="polite">6</span></div>
      <div class="collection-controls"><label class="search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="Find a recipe or ingredient" aria-label="Search recipes and ingredients"><kbd>⌘ K</kbd></label>
      <div class="filters" aria-label="Filter recipes"><button aria-pressed="true" data-filter="All">All</button><button aria-pressed="false" data-filter="Salads">Salads</button><button aria-pressed="false" data-filter="Sides">Sides</button><button aria-pressed="false" data-filter="Dips">Dips</button><button aria-pressed="false" data-filter="Hidden">Hidden</button></div></div>
      <p class="collection-status" role="status" aria-live="polite"></p>
      <nav id="recipe-list" aria-label="Recipes"></nav>
    </section>
    <article id="recipe" hidden></article>
    <noscript>This recipe book needs JavaScript enabled to show the recipes.</noscript>
  </main>
</body>
</html>
